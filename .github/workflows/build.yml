name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DotImage.slnx

      - name: Build
        run: dotnet build DotImage.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test DotImage.slnx --no-build --configuration Release --verbosity normal
